name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Deploy published image through Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["COOLIFY_URL"].rstrip("/") + "/api/v1"
          application = os.environ["COOLIFY_APP_UUID"]
          revision = os.environ["DEPLOY_SHA"]

          def api(method, path, data=None):
              request = urllib.request.Request(
                  base + path,
                  method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={
                      "Authorization": "Bearer " + os.environ["COOLIFY_TOKEN"],
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"Coolify request failed with HTTP {error.code}") from None

          api("PATCH", "/applications/" + application, {"docker_registry_image_tag": revision})
          deployment = api("POST", "/deploy", {"uuid": application})["deployments"][0]["deployment_uuid"]
          for attempt in range(120):
              status = api("GET", "/deployments/" + deployment)["status"]
              if status == "finished":
                  print("Coolify deployed revision " + revision)
                  break
              if status in {"failed", "cancelled", "cancelled-by-user"}:
                  raise RuntimeError("Coolify deployment " + status)
              time.sleep(5)
          else:
              raise RuntimeError("Timed out waiting for Coolify deployment")
          PY
